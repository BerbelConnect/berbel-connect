<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <title>Berbel Connect — Sem conexão</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#0f172a;color:#0f172a;font:16px system-ui,sans-serif}.card{max-width:520px;padding:36px;border-radius:24px;background:#fff;text-align:center;box-shadow:0 24px 60px #02061799}.marca{color:#2563eb;font-size:13px;font-weight:800;letter-spacing:.15em}.titulo{margin:8px 0;font-size:30px}.texto{color:#475569;line-height:1.6}.acoes{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:26px}a,button{border:0;border-radius:12px;padding:13px 18px;font:inherit;font-weight:700;cursor:pointer}button{background:#2563eb;color:#fff}a{border:1px solid #cbd5e1;color:#0f172a;text-decoration:none}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="marca">BERBEL CONNECT</div>
      <h1 class="titulo">Você está sem internet</h1>
      <p class="texto">Os pedidos salvos neste dispositivo continuam protegidos. Quando a conexão voltar, abra a fila offline para sincronizá-los.</p>
      <div class="acoes"><button onclick="location.reload()">Tentar novamente</button><a href="/pedidos/offline">Ver pedidos offline</a></div>
    </main>
  </body>
</html>
